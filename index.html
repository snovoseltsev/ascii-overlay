<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASCII overlay</title>
  <style>
    * { margin: 0; }
    html, body { height: 100%; }
    body { background: #b7b7b7; }

    /* Фон-дюна — как BackdropStage на сайте Axion: фиксированный слой ПОД
       оверлеем, фото-фолбэк и поверх него зацикленный клип. Это дело
       страницы, а не эффекта: ascii-overlay.js остаётся прозрачным слоем. */
    .backdrop {
      position: fixed;
      inset: 0;
      /* Полная высота вьюпорта, не дышит с URL-баром iOS — тот же приём,
         что у канваса эффекта (100lvh с фолбэком на 100vh). */
      height: 100vh;
      height: 100lvh;
      z-index: 0;
      background: #b7b7b7;
      overflow: hidden;
      pointer-events: none;
    }
    .backdrop__fallback,
    .backdrop__media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Клип горизонтальный (1920×1080, гребень на ~66% ширины), фото —
       вертикальное: на телефоне 69% ставит гребень клипа туда же, куда
       cover сажает гребень фото, и подмена фото⇄видео не «прыгает». */
    .backdrop__media { object-position: 69% 50%; }
    @media (prefers-reduced-motion: reduce) {
      .backdrop__media { display: none; }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img class="backdrop__fallback" src="./dune.jpg" alt="" width="1024" height="1536" fetchpriority="high" />
    <video class="backdrop__media" src="./background.mp4" autoplay muted loop playsinline preload="auto"></video>
  </div>
  <script src="./ascii-overlay.js" defer></script>
</body>
</html>
